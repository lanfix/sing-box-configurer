services:
  sing-box-configurer:
    image: docker.io/lanfix/sing-box-configurer:v0.6.0
    container_name: sing-box-configurer
    restart: always
    ports:
      - 8080:8080
    volumes:
      - ./sing-box-configurer.json:/app/config.json:ro
      # app.json (точка правды) и резервные копии конфига sing-box (data/backups).
      - ./data:/app/data:rw
      # Рабочий конфиг sing-box: конфигуратор атомарно заменяет его при применении.
      - ./sing-box:/etc/sing-box:rw
    depends_on:
      - docker-controller

  # Порт docker-controller не публикуется: он доступен только конфигуратору и updater
  # по внутренней сети compose (http://docker-controller:8081).
  docker-controller:
    image: docker.io/lanfix/docker-controller:v0.0.3
    container_name: docker-controller
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-controller.json:/app/config.json:ro

  sing-box:
    image: docker.io/lanfix/sing-box-lx:v1.14.1-lx.8
    container_name: sing-box
    restart: always
    network_mode: host
    command: -D /var/lib/sing-box -c /etc/sing-box/config.json run
    labels:
      - app=sing-box
      - managed=true
    depends_on:
      - sing-box-configurer
    volumes:
      - ./sing-box:/etc/sing-box:ro
      - sing-box:/var/lib/sing-box:rw
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  cron-scheduler:
    image: whefter/cron:latest
    container_name: cron-scheduler
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CRON_DAILY_RESTART=0 6 * * * docker restart sing-box

volumes:
  sing-box:
