# Релиз по тегу vX.Y.Z: бинарники собираются один раз и попадают и в архивы GitHub Release
# (установка и обновление без Docker), и в docker-образ (Docker Hub).
#
# Секреты репозитория: DOCKERHUB_USERNAME и DOCKERHUB_TOKEN (токен Docker Hub с правом записи).
# Изменения релиза берутся из секции "## vX.Y.Z" файла CHANGELOG.md.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  IMAGE: docker.io/lanfix/sing-box-configurer
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not semver (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: view/package-lock.json

      - name: Build view
        working-directory: view
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: sh scripts/build.sh "$GITHUB_REF_NAME" $(echo "$PLATFORMS" | tr ',' ' ')

      - name: Package release
        run: |
          sh scripts/package.sh "$GITHUB_REF_NAME"
          sh scripts/changelog.sh "$GITHUB_REF_NAME" > dist/release-notes.md
          cat dist/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Check that the tag is not published
        run: |
          repo="${IMAGE#docker.io/}"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/${repo}/tags/${GITHUB_REF_NAME}")"

          if [ "$status" = "200" ]; then
            echo "::error::tag ${IMAGE}:${GITHUB_REF_NAME} already exists in Docker Hub"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Стадия binaries Dockerfile подменяется бинарниками из build: образ не пересобирает код.
      - name: Build and push image
        run: |
          tags="--tag ${IMAGE}:${GITHUB_REF_NAME}"

          # latest — только для релизов без pre-release суффикса.
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="$tags --tag ${IMAGE}:latest" ;;
          esac

          docker buildx build \
            --platform "$PLATFORMS" \
            --build-context binaries=dist \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg CHANGELOG="$(cat dist/release-notes.md)" \
            $tags \
            --push \
            .

  github-release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""

          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            $flags
