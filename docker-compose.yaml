services:
  sing-box-configurer:
    image: docker.io/lanfix/sing-box-configurer:v0.0.3
    container_name: sing-box-configurer
    restart: always
    network_mode: host
    environment:
      - HTTP_PROXY=http://127.0.0.1:1080
    volumes:
      - ./config.json:/app/config.json:ro
      - ./rules.json:/app/rules.json:rw

  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.14.0
    container_name: sing-box
    restart: always
    network_mode: host
    command: -D /var/lib/sing-box -C /etc/sing-box/ run
    depends_on:
      - sing-box-configurer
    volumes:
      - ./sing-box.config.json:/etc/sing-box/config.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  cron-scheduler:
    image: whefter/cron:latest
    container_name: cron-scheduler
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CRON_DAILY_RESTART=0 6 * * * docker restart sing-box
